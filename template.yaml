AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Monsoon Sentinel - Lambda API using existing DynamoDB and S3 resources

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  DynamoDBTableName:
    Type: String
    Default: ProjectTable

  EvidenceBucketName:
    Type: String
    Default: project-evidence-a7k29x

  LambdaRoleName:
    Type: String
    Default: lambdaRole

  SageMakerEndpointName:
    Type: String
    Default: ""

Resources:
  # Attach application permissions to the existing Lambda execution role.
  RuntimeAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: MonsoonSentinelRuntimeAccess
      Roles:
        - !Ref LambdaRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: IncidentTableAccess
            Effect: Allow
            Action:
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}/index/*"

          - Sid: EvidenceBucketListing
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${EvidenceBucketName}"

          - Sid: EvidenceObjectAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${EvidenceBucketName}/*"

          - Sid: SageMakerEndpointInvocation
            Effect: Allow
            Action:
              - sagemaker:InvokeEndpoint
            Resource:
              - !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/*"

  # API Gateway REST API.
  SentinelApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      EndpointConfiguration: REGIONAL

  # FastAPI application adapted through Mangum.
  SentinelFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - RuntimeAccessPolicy
    Properties:
      FunctionName: monsoon-sentinel-api
      CodeUri: backend/
      Handler: app.api.main.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 30
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaRoleName}"
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          STORAGE_BACKEND: dynamodb
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
          EVIDENCE_BUCKET: !Ref EvidenceBucketName
          S3_BUCKET_NAME: !Ref EvidenceBucketName
          USE_MOCK_SAGEMAKER: "true"
          SAGEMAKER_ENDPOINT_NAME: !Ref SageMakerEndpointName

      Events:
        RootApi:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /
            Method: ANY

        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Monsoon Sentinel API endpoint
    Value: !Sub "https://${SentinelApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/"

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref SentinelFunction

  DynamoDBTableName:
    Description: Existing DynamoDB table used by the API
    Value: !Ref DynamoDBTableName

  EvidenceBucketName:
    Description: Existing private evidence bucket
    Value: !Ref EvidenceBucketName
